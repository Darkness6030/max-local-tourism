# Include only inside the existing HTTPS server block for kaktut.ru.
# Exact registered URL is served without a redirect, preserving MAX launch data.
location = /max/app {
    proxy_pass http://127.0.0.1:18091/;
    include /etc/nginx/snippets/max-local-tourism-proxy.conf;
}
location ^~ /max/app/ {
    proxy_pass http://127.0.0.1:18091/;
    include /etc/nginx/snippets/max-local-tourism-proxy.conf;
}
